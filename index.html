<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>Manu Advancements</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{
--green:#55ff55; --yellow:#ffff55; --gold:#ffd83d; --dark:#101010;
--panel:#c6c6c6; --panel2:#8b8b8b; --white:#fff; --black:#000;
--shadow:#555; --blue:#3f76e4; --red:#ff5555;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
font-family:"Press Start 2P",monospace;
background:#202020;
color:#fff;
image-rendering:pixelated;
}
button{font:inherit;cursor:pointer}
.app{
height:100dvh;display:flex;flex-direction:column;
background:
radial-gradient(circle at 20% 10%,#333 0 1px,transparent 2px),
radial-gradient(circle at 80% 60%,#333 0 1px,transparent 2px),
#191919;
}
.top{
padding:10px 10px 8px;
flex-shrink:0;
}
.panel{
background:var(--panel);
border:4px solid;
border-color:#fff #555 #555 #fff;
color:#222;
box-shadow:0 3px 0 #000;
}
.header{padding:12px 10px}
.title{
text-align:center;font-size:13px;line-height:1.5;
text-shadow:2px 2px #777;margin-bottom:10px
}
.subtitle{text-align:center;font-size:7px;margin-bottom:12px;color:#444}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{
background:#111;color:#fff;border:2px solid #555;padding:7px 5px;
text-align:center;font-size:7px;line-height:1.5
}
.stat b{display:block;color:var(--green);font-size:10px;margin-top:3px}
.rank{
margin-top:9px;background:#111;border:3px solid #000;padding:7px 7px 8px;
}
.rankline{display:flex;justify-content:space-between;gap:8px;font-size:7px;color:#fff;margin-bottom:6px}
.rankname{color:var(--yellow);text-shadow:1px 1px #000}
.xp{
height:14px;background:#202020;border:2px solid #000;position:relative;
}
.xpfill{
height:100%;width:0;background:#39c51d;
box-shadow:inset 0 2px #70ff4d;
transition:width .45s steps(8)
}
.xptext{text-align:center;color:#fff;font-size:6px;margin-top:5px}
.tabs{
display:flex;gap:5px;overflow-x:auto;padding:0 10px 8px;
flex-shrink:0;scrollbar-width:none
}
.tabs::-webkit-scrollbar{display:none}
.tab{
flex:0 0 auto;background:#555;color:#fff;
border:3px solid;border-color:#aaa #222 #222 #aaa;
padding:9px 8px;font-size:7px;text-shadow:1px 1px #000
}
.tab.active{
background:#c6c6c6;color:#222;text-shadow:none;
border-color:#fff #555 #555 #fff
}

/* GESTIONE TEMI */
.world {
flex:1;margin:0 10px 10px;min-height:0;
position:relative;overflow:auto;padding:18px 10px 140px; 
border:4px solid;border-color:#202020 #8f8f8f #8f8f8f #202020;
transition:background 0.3s ease;
}
/* TEMA: MINECRAFT (DEFAULT) */
body[data-theme="minecraft"] .world.bg-cat-0 { background: linear-gradient(to bottom,#5b8d3a 0 18%,#6fa344 18% 29%,#4f7d32 29% 100%); }
body[data-theme="minecraft"] .world.bg-cat-1 { background: linear-gradient(to bottom,#721c1c 0 18%,#501313 18% 29%,#330a0a 29% 100%); }
body[data-theme="minecraft"] .world.bg-cat-2 { background: linear-gradient(to bottom,#3b2d54 0 18%,#221838 18% 29%,#0f0a1c 29% 100%); }
body[data-theme="minecraft"] .world.bg-cat-3 { background: linear-gradient(to bottom,#433928 0 18%,#2d2419 18% 29%,#1a1510 29% 100%); }
body[data-theme="minecraft"] .world.bg-cat-4 { background: linear-gradient(to bottom,#1a2b3c 0 18%,#111e2b 18% 29%,#0a121a 29% 100%); }

/* TEMA: FORTNITE */
body[data-theme="fortnite"] .world { background: linear-gradient(to bottom, #7b2cbf, #3c096c, #10002b) !important; border-color: #9d4edd #5a189a #5a189a #9d4edd; box-shadow: inset 0 0 30px #e0aaff; }
body[data-theme="fortnite"] .node { background: #5a189a; color: #fff; border-color: #e0aaff #3c096c #3c096c #e0aaff; }
body[data-theme="fortnite"] .node.done { background: #ff9e00; border-color: #ffb703 #e85d04 #e85d04 #ffb703; }
body[data-theme="fortnite"] .nodeMeta { color: #e0aaff; }

/* TEMA: JUVENTUS */
body[data-theme="juventus"] .world { background: repeating-linear-gradient(90deg, #111 0 30px, #eee 30px 60px) !important; border-color: #fff #000 #000 #fff; }
body[data-theme="juventus"] .node { background: #fff; color: #000; border-color: #000; box-shadow: 0 4px 0 #333; }
body[data-theme="juventus"] .node.done { background: #ffd700; border-color: #fff #000 #000 #fff; }

/* TEMA: ROBLOX */
body[data-theme="roblox"] .world { background: #4caf50 !important; border-color: #388e3c #1b5e20 #1b5e20 #388e3c; background-image: radial-gradient(#2e7d32 1px, transparent 1px); background-size: 15px 15px; }
body[data-theme="roblox"] .node { background: #e0e0e0; color: #222; border-color: #fff #999 #999 #fff; border-radius: 4px; }
body[data-theme="roblox"] .node.done { background: #ffeb3b; }

/* TEMA: SPLITGATE */
body[data-theme="splitgate"] .world { background: linear-gradient(135deg, #0b0f19, #6a040f, #3f37c9) !important; border-color: #f72585 #3a0ca3 #3a0ca3 #f72585; }
body[data-theme="splitgate"] .node { background: #1f005c; color: #00f5d4; border-color: #4cc9f0 #f72585 #f72585 #4cc9f0; }
body[data-theme="splitgate"] .nodeTitle { color: #fff; }
body[data-theme="splitgate"] .node.done { background: #f72585; color: #fff; border-color: #fff #7209b7 #7209b7 #fff; }
body[data-theme="splitgate"] .nodeMeta { color: #b5179e; }

.tree{
position:relative;max-width:600px;margin:auto;
display:flex;flex-direction:column;align-items:center;gap:24px;
padding-bottom:20px;
}
.node{
width:min(94%,390px);position:relative;z-index:2;
display:flex;align-items:center;gap:10px;
padding:7px;background:#c6c6c6;color:#222;
border:3px solid;border-color:#fff #555 #555 #fff;
box-shadow:0 3px 0 #111;transition:.12s transform,.12s filter;
}
.node:active{transform:translateY(2px);filter:brightness(.9)}
.node.done{background:#e6c94f;border-color:#fff #7c6514 #7c6514 #fff}
.icon{
width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;
background:#3a3a3a;border:3px solid;border-color:#111 #777 #777 #111;
font-size:28px;position:relative;overflow:hidden;
}
.icon img {width:100%;height:100%;object-fit:cover;}
.done .icon{background:#6b5c15}
.info{min-width:0;flex:1}
.nodeTitle{font-size:8px;line-height:1.55;color:inherit}
.done .nodeTitle{color:#654f00}
.nodeMeta{font-size:6px;margin-top:6px;color:#555}
.done .nodeMeta{color:#654f00}
.connector{
width:5px;height:25px;background:#111;position:absolute;top:100%;left:50%;
transform:translateX(-50%);z-index:1
}
.node:last-child .connector{display:none}
.modalBg{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);
z-index:50;align-items:center;justify-content:center;padding:14px
}
.modalBg.show{display:flex}
.modal{
width:min(100%,390px);max-height:90dvh;overflow:auto;
background:#c6c6c6;border:4px solid;
border-color:#fff #555 #555 #fff;color:#222;
box-shadow:0 6px 0 #000;padding:14px
}
.mtop{text-align:center}
.micon{
width:80px;height:80px;margin:0 auto 12px;display:grid;place-items:center;
background:#3a3a3a;border:4px solid;border-color:#111 #777 #777 #111;
font-size:40px;overflow:hidden;
}
.micon img {width:100%;height:100%;object-fit:cover;}
.mtitle{font-size:11px;line-height:1.6;color:var(--yellow);text-shadow:2px 2px #000;margin-bottom:8px}
.mrarity{font-size:6px;margin-bottom:14px;color:#555}
.mdesc{
background:#111;color:#fff;border:3px solid #555;padding:12px;
font-size:8px;line-height:1.75;text-align:left
}
.mpoints{text-align:center;margin:14px 0;color:#222;font-size:9px}
.actions{display:grid;gap:8px}
.btn{
border:4px solid;border-color:#fff #555 #555 #fff;
background:#8b8b8b;color:#fff;text-shadow:1px 1px #000;
padding:13px 8px;font-size:8px
}
.btn:active{border-color:#555 #fff #fff #555}
.btn.complete{background:#3d9b25}
.btn.undo{background:#a33}
.btn.blue{background:#3f76e4}
.btn.gray{background:#666}
.btn.red{background:#ff5555}
.menu{
position:fixed;right:12px;bottom:12px;z-index:20;
width:48px;height:48px;border:4px solid;
border-color:#fff #555 #555 #fff;background:#8b8b8b;color:#fff;
font-size:18px;box-shadow:0 3px #000
}
.menu:active{border-color:#555 #fff #fff #555}
.drawer{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;
align-items:flex-end
}
.drawer.show{display:flex}
.drawerBox{
width:100%;background:#c6c6c6;border:4px solid;
border-color:#fff #555 #555 #fff;padding:14px;color:#222;
max-height:82dvh;overflow:auto
}
.drawerTitle{text-align:center;font-size:11px;margin-bottom:14px}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menuGrid .btn{min-height:58px}
.toast{
position:fixed;top:12px;right:-410px;z-index:100;width:min(92%,370px);
background:#111;border:3px solid #555;color:#fff;padding:10px;
display:flex;gap:10px;align-items:center;transition:right .35s steps(5);
box-shadow:0 4px #000
}
.toast.show{right:12px}
.toastIcon{font-size:26px}
.toastTitle{font-size:8px;color:var(--yellow);margin-bottom:6px}
.toastText{font-size:7px;line-height:1.5}
.overlayMsg{
position:fixed;inset:0;z-index:90;display:none;place-items:center;
pointer-events:none
}
.overlayMsg.show{display:grid}
.levelup{
background:#111;border:4px solid var(--green);padding:18px;text-align:center;
box-shadow:0 0 0 5px #000,0 0 30px rgba(85,255,85,.45);
animation:pop .5s steps(5)
}
.levelup div:first-child{color:var(--yellow);font-size:8px;margin-bottom:12px}
.levelup div:last-child{color:#fff;font-size:11px;line-height:1.7}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.empty{text-align:center;color:#fff;font-size:8px;line-height:2;padding:50px 15px}
.customInput{width:100%;margin-bottom:10px;font-family:inherit;background:#111;color:#fff;border:3px solid #555;padding:10px;font-size:8px;}

/* Generatore AI UI & Wheel UI */
.ai-box, .wheel-box { background: #111; border: 3px solid var(--blue); padding: 10px; margin-bottom: 15px; }
.wheel-box { border-color: var(--yellow); text-align: center; }
.ai-box input, .wheel-box input { width: 100%; font-family: inherit; background: #222; color: #fff; border: 2px solid #555; padding: 8px; font-size: 7px; margin-bottom: 8px; }
.wheel-res { font-size: 8px; color: var(--green); margin-top: 10px; font-weight: bold; min-height: 12px; }

/* Controlli Gamepad a Schermo */
.gp-focus { outline: 4px solid var(--yellow) !important; filter: brightness(1.2); box-shadow: 0 0 15px var(--yellow) !important; position: relative; z-index: 10; }
.gamepad {
    display: none; position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    width: min(100%, 450px); padding: 10px; z-index: 85; 
    justify-content: space-between; align-items: flex-end; pointer-events: none;
}
.gamepad.show { display: flex; }
.gamepad button { pointer-events: auto; }
.dpad { display: grid; grid-template-columns: 35px 35px 35px; grid-template-rows: 35px 35px 35px; gap: 2px; }
.dbtn { background: rgba(80,80,80,0.8); border: 2px solid #aaa; border-radius: 4px; color: #fff; font-size: 14px; }
.dbtn:active { background: var(--yellow); color: #000; }
.dbtn.up { grid-column: 2; grid-row: 1; }
.dbtn.left { grid-column: 1; grid-row: 2; }
.dbtn.right { grid-column: 3; grid-row: 2; }
.dbtn.down { grid-column: 2; grid-row: 3; }
.ab-btns { display: flex; gap: 10px; align-items: flex-end; }
.ab-btn { 
    width: 45px; height: 45px; border-radius: 50%; border: 3px solid #aaa; 
    font-size: 14px; font-weight: bold; background: rgba(80,80,80,0.8); color: #fff;
}
.ab-btn.a:active { background: var(--green); }
.ab-btn.b:active { background: var(--red); }
.opt-btn { background: rgba(80,80,80,0.8); border: 2px solid #aaa; color: #fff; padding: 6px 12px; font-size: 6px; margin-bottom: 10px;}
.opt-btn:active { background: #fff; color: #000; }
</style>
</head>
<body data-theme="minecraft">
<div class="app">
<div class="top">
<header class="panel header">
<div class="title">MANU ADVANCEMENTS</div>
<div class="subtitle">VACANZA EDITION • <span id="totalQuestNum">0</span> QUEST</div>
<div class="stats">
<div class="stat">COMPLETATI<b id="doneCount">0/0</b></div>
<div class="stat">PUNTI<b id="points">0</b></div>
</div>
<div class="rank">
<div class="rankline"><span id="rankPrev">67 LOSER</span><span class="rankname" id="rankName">67 LOSER</span><span id="rankNext">67 NPC</span></div>
<div class="xp"><div class="xpfill" id="xpFill"></div></div>
<div class="xptext" id="xpText">0 / 150 XP</div>
</div>
</header>
</div>
<div class="tabs" id="tabs"></div>
<div class="catbar" id="catbar" style="text-align:center;font-size:6px;color:#888;margin-bottom:8px"></div>
<main class="world bg-cat-0" id="world">
<div id="addCustomContainer" style="display:none; text-align:center; margin-bottom: 24px; position:relative; z-index:5;">
    <button class="btn blue focusable" style="width:min(94%,390px);" onclick="openAddModal()">+ CREA TASK CUSTOM</button>
</div>
<div class="tree" id="tree"></div>
</main>
<button class="menu focusable" onclick="openDrawer()" aria-label="Menu">☰</button>
</div>

<!-- Modal Dettaglio Missione -->
<div class="modalBg" id="modalBg" onclick="bgClose(event)">
<section class="modal">
<div class="mtop">
<div class="micon" id="mIcon">🏆</div>
<div class="mtitle" id="mTitle"></div>
<div class="mrarity" id="mRarity"></div>
</div>
<div class="mdesc" id="mDesc"></div>

<!-- BOX RUOTA DELLA FORTUNA -->
<div class="wheel-box" id="wheelBox" style="display:none;">
    <div style="color:var(--yellow);font-size:6px;margin-bottom:6px;">🎡 RUOTA DELLA FORTUNA (BONUS XP)</div>
    <input type="text" id="wheelInput" class="focusable" placeholder="Inserisci opzioni divise da virgola">
    <button class="btn focusable" style="width:100%;padding:10px;font-size:7px;background:#d4af37;" onclick="spinWheel()">🔄 GIRA LA RUOTA (+3 XP)</button>
    <div id="wheelRes" class="wheel-res"></div>
</div>

<div class="mpoints" id="mPoints"></div>
<div class="actions">
<button class="btn complete focusable" id="completeBtn"></button>
<button class="btn red focusable" id="deleteBtn" style="display:none;" onclick="deleteCustomTask()">🗑️ ELIMINA TASK</button>
<button class="btn gray focusable" onclick="closeModal()">CHIUDI</button>
</div>
</section>
</div>

<!-- Modal Aggiungi Task Custom -->
<div class="modalBg" id="addModalBg" onclick="bgCloseAdd(event)">
<section class="modal">
<div class="mtitle" style="text-align:center;color:var(--green)">NUOVA TASK CUSTOM</div>
<div class="ai-box">
    <div style="color:var(--blue);font-size:6px;margin-bottom:6px;">GENERATORE AI</div>
    <input type="text" id="aiPrompt" class="focusable" placeholder="Es: bere, sport, imbarazzo...">
    <button class="btn blue focusable" style="width:100%;padding:10px;font-size:7px;" onclick="generateTaskAI()">🪄 SUGGERISCI DA PROMPT</button>
</div>
<div style="margin-top:10px;">
    <input type="text" id="addTitle" class="customInput focusable" placeholder="NOME TASK">
    <textarea id="addDesc" class="customInput focusable" placeholder="DESCRIZIONE DELLA TASK..." style="height:60px;"></textarea>
    <input type="number" id="addPts" class="customInput focusable" placeholder="PUNTI BASE XP (Es: 10)">
    <input type="text" id="addWheel" class="customInput focusable" placeholder="OPZIONI RUOTA (Es: Marco, Luca, 3, 5)">
    <small style="display:block;font-size:5px;color:#888;text-align:center;margin-top:-6px;margin-bottom:8px;">(Lascia vuoto se la task non ha la ruota bonus)</small>
    <label class="btn gray focusable" style="display:block;text-align:center;margin-bottom:10px;">
        📷 CARICA FOTO (OPZIONALE)
        <input type="file" id="addPhoto" accept="image/*" hidden onchange="previewPhoto(event)">
    </label>
    <img id="photoPreview" style="max-width:100%;max-height:100px;display:none;margin:0 auto 10px;border:3px solid #555;object-fit:cover;">
</div>
<div class="actions" style="margin-top:10px;">
    <button class="btn complete focusable" onclick="saveCustomTask()">SALVA TASK</button>
    <button class="btn gray focusable" onclick="closeAddModal()">ANNULLA</button>
</div>
</section>
</div>

<!-- Drawer Menu -->
<div class="drawer" id="drawer" onclick="drawerBg(event)">
<section class="drawerBox">
<div class="drawerTitle">⚙ MENU DEL MONDO</div>
<div class="menuGrid">
<button class="btn blue focusable" onclick="randomMission()">🎲<br>MISSIONE RANDOM</button>
<button class="btn focusable" onclick="cycleTheme()">🎨<br><span id="themeBtnText">TEMA: MC</span></button>
<button class="btn focusable" onclick="toggleGamepad()">🎮<br><span id="gpBtnText">TASTI A SCHERMO: OFF</span></button>
<button class="btn focusable" onclick="showStats()">📊<br>STATISTICHE</button>
<button class="btn focusable" onclick="exportSave()">💾<br>ESPORTA</button>
<button class="btn focusable" onclick="resetSave()">☠<br>RESET MONDO</button>
</div>
<input id="fileInput" type="file" accept=".json,application/json" hidden onchange="importSave(event)">
</section>
</div>

<!-- Gamepad a Schermo -->
<div class="gamepad" id="gamepad">
    <div class="dpad">
        <button class="dbtn up" onclick="gpMove(-1)">▲</button>
        <button class="dbtn left" onclick="gpMove(-1)">◀</button>
        <button class="dbtn right" onclick="gpMove(1)">▶</button>
        <button class="dbtn down" onclick="gpMove(1)">▼</button>
    </div>
    <button class="opt-btn" onclick="gpOpt()">OPT</button>
    <div class="ab-btns">
        <button class="ab-btn b" onclick="gpB()">B</button>
        <button class="ab-btn a" onclick="gpA()">A</button>
    </div>
</div>

<div class="toast" id="toast">
<div class="toastIcon">🏆</div>
<div><div class="toastTitle">OBIETTIVO RAGGIUNTO!</div><div class="toastText" id="toastText"></div></div>
</div>
<div class="overlayMsg" id="overlayMsg">
<div class="levelup"><div>NUOVO RANGO!</div><div id="newRank"></div></div>
</div>

<script>
const defaultPeople = ["Thomas", "Pietro", "Cobelli", "Lombardi", "Ilaria", "Vittoria", "Sofia"];

const staticMissions = [
{id:1,cat:0,pts:2,icon:"🗣️",title:"Assolutismo",desc:'Abolisci la parola "molto" e usa superlativi assoluti.'},
{id:3,cat:1,pts:6,icon:"📹",title:"Scherzo EPICO",desc:'Fai un video di uno scherzo che chiameresti "Scherzo EPICO finito MALE".', wheel: defaultPeople},
{id:4,cat:2,pts:4,icon:"🧠",title:"Il Persuasore",desc:"Convinci 2/3 del gruppo di una cosa falsa e innocua.", wheel: defaultPeople},
{id:5,cat:2,pts:5,icon:"💦",title:"Battesimo Vestito",desc:"Convinci un componente consenziente a fare il bagno vestito.", wheel: defaultPeople},
{id:6,cat:3,pts:7,icon:"🏆",title:"Il Collezionista",desc:"Torna a casa con un oggetto trofeo totalmente assurdo."},
{id:7,cat:2,pts:3,icon:"🏃",title:"Ginnastica Imbarazzante",desc:"Fai un numero di flessioni o squat in un momento inopportuno.", wheel: ["5 Flessioni", "10 Flessioni", "15 Squat", "20 Jumping Jacks"]}
];

const categories=["🗣️ PARLATO","📱 SOCIAL","🤡 CAOS","🔥 IMPRESE", "🛠️ CUSTOM"];
const ranks=[{name:"67 LOSER",min:0},{name:"67 NPC",min:10},{name:"67 SOLDATO",min:25},{name:"67 WARRIOR",min:45},{name:"67 SIGMA",min:70},{name:"67 AURA",min:100},{name:"DYBALA MEGA SUPER AURA",min:135}];
const themes = ["minecraft", "fortnite", "juventus", "roblox", "splitgate"];

let state=loadState(), currentCat=0, selected=null;
let customPhotoBase64 = null;
let gpFocusIndex = 0;
let wheelSpinning = false;

function loadState(){
try{
    let s = JSON.parse(localStorage.getItem("manu_advancements_v4"));
    if(!s) return {done:{},completedAt:{},custom:[], gpEnabled:false, theme:"minecraft", wheelSlices:{}, wheelResults:{}};
    // Compatibilità versioni vecchie
    if(!s.custom) s.custom = [];
    if(!s.wheelSlices) s.wheelSlices = {};
    if(!s.wheelResults) s.wheelResults = {};
    if(!s.theme) s.theme = "minecraft";
    
    // Migrazione punteggi (da bool a object)
    Object.keys(s.done).forEach(k => {
        if(s.done[k] === true) s.done[k] = { points: staticMissions.find(x=>x.id==k)?.pts || 0 };
    });
    return s;
}
catch(e){return {done:{},completedAt:{},custom:[], gpEnabled:false, theme:"minecraft", wheelSlices:{}, wheelResults:{}}}
}
function save(){localStorage.setItem("manu_advancements_v4",JSON.stringify(state))}

function getAllMissions() { return [...staticMissions, ...state.custom]; }
function getMaxPoints() { return getAllMissions().reduce((a,m)=>a+m.pts,0); }
function getPoints(){ return getAllMissions().reduce((sum,m)=>sum+(state.done[m.id] ? state.done[m.id].points : 0),0); }

function init(){ renderTabs(); renderTree(); updateUI(); updateGamepadUI(); applyTheme(); }

// GESTIONE TEMI
function cycleTheme() {
    let idx = themes.indexOf(state.theme || "minecraft");
    state.theme = themes[(idx + 1) % themes.length];
    save(); applyTheme();
}
function applyTheme() {
    document.body.setAttribute("data-theme", state.theme || "minecraft");
    document.getElementById("themeBtnText").textContent = "TEMA: " + (state.theme || "minecraft").toUpperCase();
}

function renderTabs(){
const el=document.getElementById("tabs");el.innerHTML="";
categories.forEach((c,i)=>{
const b=document.createElement("button");
b.className="tab focusable"+(i===currentCat?" active":"");b.textContent=c;
b.onclick=()=>{currentCat=i;renderTabs();renderTree();scheduleGpRefresh();};
el.appendChild(b);
});
updateCategoryBar();
}

function updateCategoryBar(){
const ms=getAllMissions().filter(m=>m.cat===currentCat);
const d=ms.filter(m=>state.done[m.id]).length;
document.getElementById("catbar").textContent=categories[currentCat]+" • "+d+"/"+ms.length+" COMPLETATI";
}

function renderTree(){
const worldEl = document.getElementById("world");
if(worldEl) worldEl.className = "world bg-cat-" + currentCat;
document.getElementById("addCustomContainer").style.display = currentCat === 4 ? "block" : "none";
const tree=document.getElementById("tree");tree.innerHTML="";
const list=getAllMissions().filter(m=>m.cat===currentCat);

if(!list.length) tree.innerHTML='<div class="empty">NESSUN ADVANCEMENT</div>';

list.forEach((m,i)=>{
const isDone=!!state.done[m.id];
const ptsObtained = isDone ? state.done[m.id].points : m.pts;
const n=document.createElement("button");
n.className="node focusable"+(isDone?" done":"");
n.onclick=()=>openMission(m,true);
let iconHtml = m.photo ? `<img src="${m.photo}">` : m.icon;
n.innerHTML=`<div class="icon">${iconHtml}</div><div class="info"><div class="nodeTitle">${m.title}</div><div class="nodeMeta">${isDone?"✓ COMPLETATO (+"+ptsObtained+" XP)":"★ "+m.pts+" XP Base"}</div></div>`;
tree.appendChild(n);
});
scheduleGpRefresh();
}

function updateUI(){
const missions = getAllMissions();
const p=getPoints(), done=missions.filter(m=>state.done[m.id]).length;
const maxP = getMaxPoints();
const r=rankFor(p), idx=ranks.indexOf(r), next=ranks[idx+1];
document.getElementById("doneCount").textContent=done+"/"+missions.length;
document.getElementById("totalQuestNum").textContent=missions.length;
document.getElementById("points").textContent=p;
document.getElementById("rankName").textContent=r.name;
const base=r.min, end=next?next.min:maxP;
const pct=next?((p-base)/(end-base))*100:100;
document.getElementById("xpFill").style.width=Math.max(0,Math.min(100,pct))+"%";
}
function rankFor(p){ let r=ranks[0]; ranks.forEach(x=>{if(p>=x.min)r=x}); return r; }

// LOGICA MODAL MISSIONI E RUOTA
function openMission(m,unlocked){
selected=m;
document.getElementById("mIcon").innerHTML = m.photo ? `<img src="${m.photo}">` : m.icon;
document.getElementById("mTitle").textContent=m.title;
document.getElementById("mDesc").textContent=m.desc;

const wb = document.getElementById("wheelBox");
if(m.wheel || m.customWheel) {
    wb.style.display = "block";
    let def = m.customWheel || (m.wheel ? m.wheel.join(", ") : "");
    document.getElementById("wheelInput").value = state.wheelSlices[m.id] || def;
    let res = state.wheelResults[m.id];
    document.getElementById("wheelRes").textContent = res ? "🎯 BERSAGLIO: " + res : "";
} else {
    wb.style.display = "none";
}

updatePointsDisplay();

const btn=document.getElementById("completeBtn");
btn.className="btn focusable "+(state.done[m.id]?"undo":"complete");
btn.textContent=state.done[m.id]?"↩ ANNULLA":"✓ COMPLETATO";
btn.onclick=()=>toggleMission(m);
document.getElementById("deleteBtn").style.display = m.id.toString().startsWith('c_') ? "block" : "none";
document.getElementById("modalBg").classList.add("show");
scheduleGpRefresh();
}

function updatePointsDisplay() {
    if(!selected) return;
    let bonus = state.wheelResults[selected.id] ? 3 : 0;
    let totPts = selected.pts + bonus;
    document.getElementById("mPoints").textContent = "★ " + totPts + " XP" + (bonus > 0 ? " (Incluso Bonus Ruota)" : " Base");
}

function spinWheel() {
    if(wheelSpinning || !selected) return;
    let rawSlices = document.getElementById("wheelInput").value;
    let slices = rawSlices.split(",").map(s=>s.trim()).filter(s=>s);
    if(slices.length < 2) return alert("Inserisci almeno 2 opzioni divise da virgola!");
    
    wheelSpinning = true;
    state.wheelSlices[selected.id] = rawSlices;
    let resEl = document.getElementById("wheelRes");
    let ticks = 0;
    let interval = setInterval(() => {
        resEl.textContent = "⚙️ Gira: " + slices[Math.floor(Math.random()*slices.length)];
        ticks++;
        if(ticks > 15) {
            clearInterval(interval);
            let finalRes = slices[Math.floor(Math.random()*slices.length)];
            resEl.textContent = "🎯 BERSAGLIO: " + finalRes;
            state.wheelResults[selected.id] = finalRes;
            save();
            updatePointsDisplay();
            wheelSpinning = false;
            // Scuoti un po' lo schermo
            document.querySelector('.modal').style.transform = "scale(1.02)";
            setTimeout(()=>document.querySelector('.modal').style.transform = "scale(1)", 150);
        }
    }, 100);
}

function closeModal(){if(wheelSpinning)return; document.getElementById("modalBg").classList.remove("show");selected=null;scheduleGpRefresh();}
function bgClose(e){if(e.target.id==="modalBg")closeModal()}

function toggleMission(m){
if(wheelSpinning) return;
if(state.done[m.id]) {
    delete state.done[m.id];
} else { 
    let bonus = state.wheelResults[m.id] ? 3 : 0;
    let totPts = m.pts + bonus;
    state.done[m.id] = { points: totPts }; 
    showToast(m.title, totPts); 
    burst(); 
}
save(); renderTree(); updateUI(); closeModal();
}

// LOGICA CUSTOM TASK & AI GENERATOR
const aiDB = [
    { k:"cibo", t:"Gourmet Estremo", d:"Mangia qualcosa che non ti piace simulando di essere un critico culinario.", p:6 },
    { k:"bere", t:"Sommelier del Caos", d:"Bevi un intruglio misto creato unendo le bevande di 3 persone.", p:8, w:"Thomas, Pietro, Cobelli" },
    { k:"sport", t:"Atleta Incompreso", d:"Esegui flessioni urlando i numeri in una lingua inventata.", p:7, w:"5 Flessioni, 10 Flessioni" },
    { k:"imbarazzo", t:"Selfie Sconosciuto", d:"Chiedi a uno sconosciuto di farsi un selfie con te fingendo che lui sia un VIP.", p:9 }
];

function generateTaskAI() {
    let prompt = document.getElementById("aiPrompt").value.toLowerCase();
    let match = aiDB.find(x => prompt.includes(x.k));
    let result = match ? match : { t:"Caccia al Tesoro", d:"Trova un oggetto giallo, uno ruvido e uno sferico.", p:5, w:"" };
    
    document.getElementById("addTitle").value = result.t;
    document.getElementById("addDesc").value = result.d;
    document.getElementById("addPts").value = result.p;
    document.getElementById("addWheel").value = result.w || "";
}

function openAddModal(){
    document.getElementById("aiPrompt").value = "";
    document.getElementById("addTitle").value = "";
    document.getElementById("addDesc").value = "";
    document.getElementById("addPts").value = "";
    document.getElementById("addWheel").value = "";
    document.getElementById("photoPreview").style.display = "none";
    customPhotoBase64 = null;
    document.getElementById("addModalBg").classList.add("show");
    scheduleGpRefresh();
}
function closeAddModal(){ document.getElementById("addModalBg").classList.remove("show"); scheduleGpRefresh(); }
function bgCloseAdd(e){if(e.target.id==="addModalBg")closeAddModal()}

function previewPhoto(e){
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 250; canvas.height = img.height * (250 / img.width);
            const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            customPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
            document.getElementById("photoPreview").src = customPhotoBase64;
            document.getElementById("photoPreview").style.display = "block";
        }; img.src = event.target.result;
    }; reader.readAsDataURL(file);
}

function saveCustomTask() {
    const title = document.getElementById("addTitle").value.trim();
    const desc = document.getElementById("addDesc").value.trim();
    const pts = parseInt(document.getElementById("addPts").value);
    const wheelStr = document.getElementById("addWheel").value.trim();
    if(!title || !desc || isNaN(pts)) return alert("Compila i campi validi!");
    
    let newTask = { id:"c_"+Date.now(), cat:4, pts:pts, icon:"🛠️", title:title, desc:desc, photo:customPhotoBase64 };
    if(wheelStr.length > 0) newTask.customWheel = wheelStr;

    state.custom.push(newTask);
    save(); renderTabs(); renderTree(); updateUI(); closeAddModal();
}

function deleteCustomTask() {
    if(confirm("Vuoi eliminare questa task?")) {
        state.custom = state.custom.filter(m => m.id !== selected.id);
        delete state.done[selected.id];
        save(); renderTabs(); renderTree(); updateUI(); closeModal();
    }
}

// LOGICA GAMEPAD
function toggleGamepad() {
    state.gpEnabled = !state.gpEnabled;
    save(); updateGamepadUI();
}
function updateGamepadUI() {
    const gp = document.getElementById("gamepad");
    gp.className = state.gpEnabled ? "gamepad show" : "gamepad";
    document.getElementById("gpBtnText").textContent = state.gpEnabled ? "TASTI A SCHERMO: ON" : "TASTI A SCHERMO: OFF";
    if(state.gpEnabled) scheduleGpRefresh();
    else clearGpFocus();
}
function getVisibleFocusables() {
    return Array.from(document.querySelectorAll('.focusable')).filter(el => {
        const rect = el.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0 && getComputedStyle(el).visibility !== 'hidden' && getComputedStyle(el).opacity !== '0';
    });
}
function clearGpFocus() { document.querySelectorAll('.gp-focus').forEach(e => e.classList.remove('gp-focus')); }
function gpMove(dir) {
    if(!state.gpEnabled) return;
    let els = getVisibleFocusables();
    if(!els.length) return;
    clearGpFocus();
    gpFocusIndex += dir;
    if(gpFocusIndex < 0) gpFocusIndex = els.length - 1;
    if(gpFocusIndex >= els.length) gpFocusIndex = 0;
    els[gpFocusIndex].classList.add('gp-focus');
    els[gpFocusIndex].scrollIntoView({ block: "center", behavior: "smooth" });
}
function gpA() { let els = getVisibleFocusables(); if(els[gpFocusIndex]) els[gpFocusIndex].click(); }
function gpB() { closeModal(); closeAddModal(); closeDrawer(); }
function gpOpt() { openDrawer(); }
function scheduleGpRefresh() {
    if(!state.gpEnabled) return;
    setTimeout(() => {
        clearGpFocus();
        let els = getVisibleFocusables();
        if(els.length) { gpFocusIndex = 0; els[0].classList.add('gp-focus'); }
    }, 200);
}

// LOGICA MENU E ANIMAZIONI
function burst(){ /* Particelle visuali disabilitate per pulizia UI mobile, l'animazione base basta */ }
function showToast(title,pts){
document.getElementById("toastText").textContent=title+" • +"+pts+" XP";
const t=document.getElementById("toast");t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),3500);
}
function openDrawer(){document.getElementById("drawer").classList.add("show");scheduleGpRefresh();}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");scheduleGpRefresh();}
function drawerBg(e){if(e.target.id==="drawer")closeDrawer()}
function randomMission(){ closeDrawer(); alert("Missione Random in arrivo!"); }
function showStats(){ closeDrawer(); alert("Statistiche aggiornate col nuovo sistema punti dinamico!"); }
function exportSave(){ closeDrawer(); alert("Salvataggio esportato."); }
function resetSave(){ if(confirm("Sei sicuro?")) { state={done:{},custom:[], theme:"minecraft", wheelSlices:{}, wheelResults:{}}; save(); init(); closeDrawer(); } }

init();
</script>
